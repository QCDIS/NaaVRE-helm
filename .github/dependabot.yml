version: 2

updates:
  - package-ecosystem: "helm"
    directory: "/naavre"
    allow:
      - dependency-name: seaweedfs
    ignore:
      - dependency-name: "*" # Wildcard ignores all dependencies
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    schedule:
      interval: "weekly"
    registries:
      - seaweedfs-helm-repo
      - jupyterhub-helm-repo

registries:
  seaweedfs-helm-repo:
    type: helm-registry
    url: https://seaweedfs.github.io/seaweedfs/helm
    username: ""
    password: ""
  jupyterhub-helm-repo:
    type: helm-registry
    url: https://jupyterhub.github.io/helm-chart/helm
    username: ""
    password: ""
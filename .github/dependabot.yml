version: 2

updates:
  - package-ecosystem: "helm"
    directory: "/naavre"
    allow:
      - dependency-name: k8s-secret-creator
      - dependency-name: naavre-catalogue-service
      - dependency-name: naavre-containerizer-service
      - dependency-name: naavre-workflow-service
      - dependency-name: naavre-paas-frontend
    ignore:
      - dependency-name: "*" # Wildcard ignores all dependencies
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    schedule:
      interval: "weekly"
    registries:
      - qcdis-helm-repo

registries:
  qcdis-helm-repo:
    type: helm-registry
    url: oci://ghcr.io/qcdis/charts
    username: "user"
    password: "pwd"